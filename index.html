<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Load Brython and p5.js libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.13.2/brython.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
</head>

<body onload="brython()">
    <div id="sketch-holder"></div>

    <script type="text/python">
    from browser import window

    def sketch(p):
        # Define the setup function
        def setup():
            p.createCanvas(400, 400)
            p.background(220)

        # Define the draw loop
        def draw():
            p.background(220)
            p.fill(255, 0, 0)
            # Access p5 properties like mouseX and mouseY via the p object
            p.rect(p.mouseX, p.mouseY, 50, 50)

        # Map Python functions to the p5 instance
        p.setup = setup
        p.draw = draw

    # Initialize p5 in instance mode
    window.p5.new(sketch, "sketch-holder")
    </script>
</body>
</html>
